name: Costruisci APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara la firma fissa
        run: |
          if [ ! -f keystore.p12 ]; then
            keytool -genkeypair -v -keystore keystore.p12 -storetype PKCS12 -storepass fotoscenari -alias fotoscenari -keypass fotoscenari -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=FotoScenari"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore.p12
            git commit -m "Aggiunge la firma fissa generata dalla costruzione" -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_015ATFKPbFWBnusPfWMHiyqg"
            git push
          fi

      - name: Prepara Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Costruisci l'APK
        run: gradle assembleDebug --no-daemon

      - name: Salva l'APK
        uses: actions/upload-artifact@v4
        with:
          name: test-fotocamere-fold5-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Pubblica la Release con link diretto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "Costruzione ${{ github.run_number }}" --notes "APK di test, scaricabile direttamente." --repo "${{ github.repository }}"
